fleet_name: browser-pool-primary
pool_size: 45
port_range:
  start: 9222
  end: 9266
base_user_data_dir: /var/run/browser_pool/profiles
resilience:
  soft_limit_cooldown_sec: 30.0
  hard_limit_cooldown_sec: 300.0
  quarantine_duration_sec: 600.0
  max_consecutive_failures: 3
  backoff_multiplier: 2.0
  jitter: true
  rate_limit_patterns:
  - '429'
  - rate limit
  - too many requests
  - quota exceeded
  - quota exhausted
  - throttled
  - resource exhausted
  transient_patterns:
  - timeout
  - content filtered
  - policy retry
  - navigation timeout
  - temporary hiccup
  - target closed
  - dom race
  - element not interactable
telemetry:
  enabled: true
  metrics_export_interval_sec: 5.0
  log_level: INFO
  health_check_interval_sec: 10.0
nodes:
